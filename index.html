<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pace — the bill that tells you how fast to run</title>
<meta name="description" content="Give Pace one bill and one date. It tells you what each day has to carry, and whether you are ahead or behind right now." />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<main class="card">
  <header class="top">
    <span class="wordmark">Pace</span>
    <button id="editBtn" class="ghost" hidden>Edit bill</button>
  </header>

  <section id="setup" class="setup">
    <h1>One bill. One date.<br />A number for each day.</h1>
    <p class="lede">Most apps count the days down. Pace tells you what today has to carry, and whether you are ahead or behind at this hour.</p>
    <form id="setupForm" class="stack">
      <label>What is it <input name="name" value="Rent" autocomplete="off" required /></label>
      <div class="row">
        <label>How much <input name="amount" type="number" min="1" step="0.01" value="1000" required /></label>
        <label>Due on <input name="due" type="date" required /></label>
      </div>
      <button type="submit" class="primary">Start</button>
    </form>
  </section>

  <section id="dash" class="dash" hidden>
    <div class="ringwrap">
      <svg class="ring" viewBox="0 0 260 260" role="img" aria-labelledby="ringTitle">
        <title id="ringTitle">Progress towards the bill, with a tick marking where you should be today</title>
        <circle class="track" cx="130" cy="130" r="112" />
        <circle id="arc" class="arc" cx="130" cy="130" r="112" transform="rotate(-90 130 130)" />
        <circle id="tick" class="tick" cx="130" cy="18" r="5.5" />
      </svg>
      <div class="ringmid">
        <p class="label" id="midLabel">left to find</p>
        <p class="big" id="left">$0</p>
        <p class="sub" id="leftSub">of $0</p>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <p class="label">each day, from today</p>
        <p class="big amber" id="perDay">$0</p>
      </div>
      <p class="verdict" id="verdict">—</p>
      <dl class="meta">
        <div><dt>days left</dt><dd id="days">0</dd></div>
        <div><dt>logged</dt><dd id="logged">$0</dd></div>
        <div><dt>due</dt><dd id="due">—</dd></div>
      </dl>
    </div>

    <form id="logForm" class="logrow">
      <input name="amount" type="number" min="0.01" step="0.01" placeholder="Amount in" aria-label="Amount that came in" required />
      <input name="note" placeholder="from where (optional)" aria-label="Note" autocomplete="off" />
      <button type="submit" class="primary">Log it</button>
    </form>

    <ul id="entries" class="entries"></ul>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
